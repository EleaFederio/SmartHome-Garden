esphome:
  name: pumpy
  friendly_name: Pumpy

esp8266:
  board: esp01_1m

# Enable Home Assistant API
api:
  password: !secret nft_pumpy

ota:
  - platform: esphome
    password: "d9369f8e84ccd8355eb330fe37e8f3dd"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: 192.168.1.110
    gateway: 192.168.1.1
    subnet: 255.255.255.0

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Blinking Relay"
    password: "hahaha1234"

logger:
  level: DEBUG

time:
  - platform: sntp
    id: esphome_time

captive_portal:

web_server:
  port: 80

switch:
  - platform: gpio
    id: nft_pump
    name: "NFT Pump"
    pin:
      # NOTE: This relay is connected to GPIO0. GPIO0 must be HIGH for normal boot;
      # pull it LOW only when intentionally entering the bootloader (flashing).
      # If flashing fails, disconnect the relay input from GPIO0 or use a jumper.
      number: GPIO0
      inverted: true
    restore_mode: RESTORE_DEFAULT_OFF

select:
  - platform: template
    name: "NFT Pump Mode"
    id: nft_pump_mode
    optimistic: true
    restore_value: true
    options:
      - "Normal"
      - "Eco"
      - "Super Eco"
    on_value:
      then:
        - if:
            condition:
              lambda: 'return id(nft_pump_mode).state == "Normal";'
            then:
              - switch.turn_on: nft_pump
        - if:
            condition:
              lambda: 'return id(nft_pump_mode).state != "Normal";'
            then:
              - switch.turn_off: nft_pump
        - if:
            condition:
              lambda: 'return id(nft_pump_mode).state == "Eco";'
            then:
              - script.execute: eco_cycle
        - if:
            condition:
              lambda: 'return id(nft_pump_mode).state == "Super Eco";'
            then:
              - script.execute: super_eco_cycle

script:
  - id: eco_cycle
    mode: restart
    then:
      - switch.turn_on: nft_pump
      - delay: 15min
      - switch.turn_off: nft_pump
  - id: super_eco_cycle
    mode: restart
    then:
      - switch.turn_on: nft_pump
      - delay: 15min
      - switch.turn_off: nft_pump

interval:
  - interval: 20min
    then:
      - if:
          condition:
            lambda: 'return id(nft_pump_mode).state == "Eco";'
          then:
            - script.execute: eco_cycle
  - interval: 25min
    then:
      - if:
          condition:
            lambda: 'return id(nft_pump_mode).state == "Super Eco";'
          then:
            - script.execute: super_eco_cycle
