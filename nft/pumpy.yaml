esphome:
  name: pumpy
  friendly_name: Pumpy

esp8266:
  board: esp01_1m

# Enable Home Assistant API
api:
  password: !secret nft_pumpy

ota:
  - platform: esphome
    password: "d9369f8e84ccd8355eb330fe37e8f3dd"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: 192.168.1.110
    gateway: 192.168.1.1
    subnet: 255.255.255.0

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Blinking Relay"
    password: "hahaha1234"

logger:
  level: DEBUG

time:
  - platform: sntp
    id: esphome_time
    # Internal cron schedules to change modes automatically if offline
    on_time:
      - seconds: 0
        minutes: 0
        hours: 6
        then:
          - select.set:
              id: nft_pump_mode
              option: "Eco"
      - seconds: 0
        minutes: 0
        hours: 11
        then:
          - select.set:
              id: nft_pump_mode
              option: "Noon-Time"
      - seconds: 0
        minutes: 0
        hours: 15
        then:
          - select.set:
              id: nft_pump_mode
              option: "Eco"
      - seconds: 0
        minutes: 0
        hours: 18
        then:
          - select.set:
              id: nft_pump_mode
              option: "Super Eco"

captive_portal:

web_server:
  port: 80

switch:
  - platform: gpio
    id: nft_pump
    name: "NFT Pump"
    pin:
      # NOTE: This relay is connected to GPIO0. GPIO0 must be HIGH for normal boot;
      # pull it LOW only when intentionally entering the bootloader (flashing).
      # If flashing fails, disconnect the relay input from GPIO0 or use a jumper.
      number: GPIO0
      inverted: true
    restore_mode: RESTORE_DEFAULT_OFF

select:
  - platform: template
    name: "NFT Pump Mode"
    id: nft_pump_mode
    optimistic: true
    restore_value: true
    initial_option: "Eco"
    options:
      - "Normal"
      - "Eco"
      - "Super Eco"
      - "Noon-Time"
      - "Emergency"
    on_value:
      then:
        # Stop all running background scripts first
        - script.stop: noon_time_cycle
        - script.stop: eco_cycle
        - script.stop: super_eco_cycle
        - script.stop: emergency_cycle
        # Execute the logic for the chosen mode
        - if:
            condition:
              lambda: 'return x == "Normal";'
            then:
              - switch.turn_on: nft_pump
        - if:
            condition:
              lambda: 'return x == "Eco";'
            then:
              - script.execute: eco_cycle
        - if:
            condition:
              lambda: 'return x == "Super Eco";'
            then:
              - script.execute: super_eco_cycle
        - if:
            condition:
              lambda: 'return x == "Noon-Time";'
            then:
              - script.execute: noon_time_cycle
        - if:
            condition:
              lambda: 'return x == "Emergency";'
            then:
              - script.execute: emergency_cycle

script:
  - id: noon_time_cycle
    mode: restart
    then:
      - while:
          condition:
            lambda: 'return id(nft_pump_mode).state == "Noon-Time";'
          then:
            - switch.turn_on: nft_pump
            - delay: 15min
            - switch.turn_off: nft_pump
            - delay: 5min

  - id: eco_cycle
    mode: restart
    then:
      - while:
          condition:
            lambda: 'return id(nft_pump_mode).state == "Eco";'
          then:
            - switch.turn_on: nft_pump
            - delay: 15min
            - switch.turn_off: nft_pump
            - delay: 15min # Corrected from 15min to 45min


  - id: super_eco_cycle
    mode: restart
    then:
      - while:
          condition:
            lambda: 'return id(nft_pump_mode).state == "Super Eco";'
          then:
            - switch.turn_on: nft_pump
            - delay: 15min
            - switch.turn_off: nft_pump
            - delay: 45min # Corrected from 15min to 45min

  - id: emergency_cycle
    mode: restart
    then:
      - while:
          condition:
            lambda: 'return id(nft_pump_mode).state == "Emergency";'
          then:
            - switch.turn_on: nft_pump
            - delay: 5min
            - switch.turn_off: nft_pump
            - delay: 5min


