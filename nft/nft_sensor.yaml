substitutions:
  pump_switch_entity: switch.nft_pump
  sensor_resume_delay: 30s
  ph_po_pin: GPIO1
  ph_do_pin: GPIO3
  ph_to_pin: GPIO2

esphome:
  name: nft-sensor
  friendly_name: NFT-sensor
  platformio_options:
    upload_port: COM5

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

api:
  encryption:
    key: !secret nft_key

ota:
  - platform: esphome


wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
  output_power: 8.5dB
  manual_ip:
    static_ip: 192.168.1.112
    gateway: 192.168.1.1
    subnet: 255.255.255.0
  

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "NFT Sensor AP"
    password: "hahaha1234"
    ap_timeout: 15s

logger:
  level: DEBUG

one_wire:
  - platform: gpio
    pin: GPIO4

globals:
  - id: tds_pause_active
    type: bool
    restore_value: no
    initial_value: "false"

binary_sensor:
  - platform: homeassistant
    name: "NFT Pump Running Sync"
    id: nft_pump_running
    entity_id: ${pump_switch_entity}
    on_press:
      then:
        - logger.log: "NFT pump is running, pausing TDS/EC updates"
        - lambda: |-
            id(tds_pause_active) = true;
    on_release:
      then:
        - logger.log: "NFT pump stopped, waiting before resuming TDS/EC updates"
        - delay: ${sensor_resume_delay}
        - if:
            condition:
              binary_sensor.is_off: nft_pump_running
            then:
              - lambda: |-
                  id(tds_pause_active) = false;
              - component.update: tds_adc
              - component.update: tds_raw_ppm
              - component.update: tds_calibrated_ppm
              - component.update: tds_comp_voltage

  - platform: gpio
    name: "pH Threshold Digital"
    id: ph_threshold_digital
    pin:
      number: ${ph_do_pin}
      mode:
        input: true
    device_class: problem

number:
  - platform: template
    name: "TDS Calibration Scale"
    id: tds_scale
    optimistic: true
    restore_value: true
    min_value: 0.1
    max_value: 3.0
    step: 0.01
    initial_value: 1.0

  - platform: template
    name: "TDS Calibration Offset"
    id: tds_offset
    optimistic: true
    restore_value: true
    min_value: -500
    max_value: 500
    step: 1
    initial_value: 0

  - platform: template
    name: "Water Temperature"
    id: water_temp_c
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 50
    step: 0.1
    initial_value: 25.0
    unit_of_measurement: "C"

  - platform: template
    name: "pH Calibration Slope"
    id: ph_slope
    optimistic: true
    restore_value: true
    min_value: -20
    max_value: 20
    step: 0.001
    initial_value: -5.556

  - platform: template
    name: "pH Calibration Offset"
    id: ph_offset
    optimistic: true
    restore_value: true
    min_value: -20
    max_value: 30
    step: 0.001
    initial_value: 20.889

sensor:
  - platform: dallas_temp
    name: "Hydroponic Water Temperature"
    id: hydro_water_temp_c
    update_interval: 3s
    accuracy_decimals: 2
    unit_of_measurement: "C"

  # Typical 6-pin pH module wiring:
  # V+ -> 3.3V or 5V (match your board/module spec)
  # G / G -> GND
  # Po -> ${ph_po_pin} (analog output used for pH reading)
  # Do -> ${ph_do_pin} (digital threshold output)
  # To -> ${ph_to_pin} (extra analog output from the module)
  - platform: adc
    pin: ${ph_po_pin}
    name: "pH ADC"
    id: ph_adc
    update_interval: 3s
    attenuation: 12db
    unit_of_measurement: V
    accuracy_decimals: 3
    filters:
      - lambda: |-
          if (id(tds_pause_active)) {
            return {};
          }
          return x;
      - sliding_window_moving_average:
          window_size: 10
          send_every: 1

  - platform: adc
    pin: ${ph_to_pin}
    name: "pH Module To Voltage"
    id: ph_to_voltage
    update_interval: 3s
    attenuation: 12db
    unit_of_measurement: V
    accuracy_decimals: 3
    filters:
      - sliding_window_moving_average:
          window_size: 10
          send_every: 1

  - platform: template
    name: "pH"
    id: ph_value
    lambda: |-
      if (id(tds_pause_active)) {
        return {};
      }
      float ph = id(ph_adc).state * id(ph_slope).state + id(ph_offset).state;
      if (ph < 0.0f) return 0.0f;
      if (ph > 14.0f) return 14.0f;
      return ph;
    unit_of_measurement: "pH"
    accuracy_decimals: 2
    update_interval: 3s

  - platform: adc
    pin: GPIO0
    name: "TDS ADC"
    id: tds_adc
    update_interval: 1s
    attenuation: 12db
    unit_of_measurement: V
    accuracy_decimals: 3
    filters:
      - lambda: |-
          if (id(tds_pause_active)) {
            return {};
          }
          return x;
      - sliding_window_moving_average:
          window_size: 10
          send_every: 1

  - platform: template
    name: "TDS Raw ppm"
    id: tds_raw_ppm
    lambda: |-
      if (id(tds_pause_active)) {
        return {};
      }
      float voltage = id(tds_adc).state;
      float compensation_coefficient = 1.0f + 0.02f * (id(water_temp_c).state - 25.0f);
      float compensated_voltage = voltage / compensation_coefficient;
      float tds = (133.42f * compensated_voltage * compensated_voltage * compensated_voltage
                  - 255.86f * compensated_voltage * compensated_voltage
                  + 857.39f * compensated_voltage) * 0.5f;
      if (tds < 0) return 0.0f;
      return tds;
    unit_of_measurement: "ppm"
    accuracy_decimals: 0
    update_interval: 1s

  - platform: template
    name: "TDS ppm"
    id: tds_calibrated_ppm
    lambda: |-
      if (id(tds_pause_active)) {
        return {};
      }
      float tds = id(tds_raw_ppm).state;
      tds = tds * id(tds_scale).state + id(tds_offset).state;
      if (tds < 0) return 0.0f;
      return tds;
    unit_of_measurement: "ppm"
    accuracy_decimals: 0
    update_interval: 1s

  - platform: template
    name: "TDS Compensated Voltage"
    id: tds_comp_voltage
    lambda: |-
      if (id(tds_pause_active)) {
        return {};
      }
      float voltage = id(tds_adc).state;
      float compensation_coefficient = 1.0f + 0.02f * (id(water_temp_c).state - 25.0f);
      return voltage / compensation_coefficient;
    unit_of_measurement: "V"
    accuracy_decimals: 3
    update_interval: 1s
